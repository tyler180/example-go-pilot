repos:
  - repo: https://github.com/tyler180/github-workflows
    rev: '0ecbb0fcaea1deb8a8617a51d719b821500e873f'
    hooks:
      - id: repository-hygiene
      - id: secret-scan
  - repo: local
    hooks:
      - id: go-validation
        name: Go formatting, vet and race tests
        entry: bash scripts/validate.sh
        language: system
        pass_filenames: false
        always_run: true
